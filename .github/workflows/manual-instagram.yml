name: Instagram — Five Toronto Sessions
run-name: 'Instagram cron: ${{ github.event.schedule || inputs.slot }}'

# The first GitHub cron run is deliberately away from minute 00, where GitHub
# may drop scheduled jobs during high load. :36 is a second trigger ONLY if the
# :11 trigger never materialized. A read-only Actions history guard makes
# double engagement a no-op when both triggers arrive.
# Each entry is timezone-aware, no custom UTC DST math is needed.
on:
  schedule:
    - cron: '11 5 * * *'
      timezone: 'America/Toronto'
    - cron: '36 5 * * *'
      timezone: 'America/Toronto'
    - cron: '11 9 * * *'
      timezone: 'America/Toronto'
    - cron: '36 9 * * *'
      timezone: 'America/Toronto'
    - cron: '11 15 * * *'
      timezone: 'America/Toronto'
    - cron: '36 15 * * *'
      timezone: 'America/Toronto'
    - cron: '11 18 * * *'
      timezone: 'America/Toronto'
    - cron: '36 18 * * *'
      timezone: 'America/Toronto'
    - cron: '11 22 * * *'
      timezone: 'America/Toronto'
    - cron: '36 22 * * *'
      timezone: 'America/Toronto'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Manually run one Toronto hashtag slot (at most 20 pairs)'
        required: true
        type: choice
        options:
          - 5am
          - 9am
          - 3pm
          - 6pm
          - 10pm
        default: 5am

permissions:
  contents: read
  actions: read

concurrency:
  group: instagram-one-account
  cancel-in-progress: false

jobs:
  scheduled-session:
    name: Maximum 20 new follow+like pairs on one hashtag
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Select intended Toronto session
        id: session
        env:
          CRON_EXPRESSION: ${{ github.event.schedule }}
          MANUAL_SLOT: ${{ inputs.slot || '5am' }}
        run: python -m scripts.instagram_schedule

      - name: Prevent duplicate live session when fallback cron fires
        id: guard
        if: steps.session.outputs.run == 'true'
        env:
          SLOT: ${{ steps.session.outputs.slot }}
          LOCAL_DATE: ${{ steps.session.outputs.local_date }}
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.instagram_run_guard

      - name: Install pinned Instagram client
        if: steps.session.outputs.run == 'true' && steps.guard.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt

      - name: Offline verification
        if: steps.session.outputs.run == 'true' && steps.guard.outputs.run == 'true'
        run: python -m unittest -v test_instagram_schedule test_instagram_run_guard test_instagram_cycle test_instagram_web_recent_probe test_instagram_web_recent

      - name: Follow and like up to 20 NEW posts on this hashtag
        if: steps.session.outputs.run == 'true' && steps.guard.outputs.run == 'true'
        env:
          IG_HASHTAG: ${{ steps.session.outputs.hashtag }}
          IG_SESSION_JSON: ${{ secrets.IG_SESSION_JSON }}
          IG_SESSION_GZIP_B64: ${{ secrets.IG_SESSION_GZIP_B64 }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/ig-report"
          python -m scripts.manual_instagram_actions \
            --hashtag "$IG_HASHTAG" \
            --target-count 20 \
            --single-hashtag \
            --max-pages 3 \
            --output-dir "$RUNNER_TEMP/ig-report"

      - name: Save result even if Instagram refuses an action
        if: always() && steps.session.outputs.run == 'true' && steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: instagram-session-${{ steps.session.outputs.slot }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ig-report/
          if-no-files-found: warn
          retention-days: 14
