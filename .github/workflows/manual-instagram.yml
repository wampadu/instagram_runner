name: 'Instagram Automated — Five Toronto Sessions'

# Five daily local Toronto sessions, not four: 5 AM, 9 AM, 3 PM, 6 PM, 10 PM.
# Two UTC cron hours for each slot cover EDT and EST. The DST-inapplicable
# trigger is skipped before any Instagram access.
# Maximum 20 confirmed NEW follow + like pairs per run, one hashtag only.
on:
  schedule:
    # 10 PM Toronto (02:00 UTC EDT / 03:00 UTC EST, following UTC date)
    - cron: '0 2 * * *'
    - cron: '0 3 * * *'
    # 5 AM Toronto
    - cron: '0 9 * * *'
    - cron: '0 10 * * *'
    # 9 AM Toronto
    - cron: '0 13 * * *'
    - cron: '0 14 * * *'
    # 3 PM Toronto
    - cron: '0 19 * * *'
    - cron: '0 20 * * *'
    # 6 PM Toronto
    - cron: '0 22 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Manually run exactly one Toronto slot/hashtag (20 pairs)'
        required: true
        type: choice
        options:
          - 5am
          - 9am
          - 3pm
          - 6pm
          - 10pm
        default: 5am

permissions:
  contents: read

concurrency:
  group: instagram-manual-one-account
  cancel-in-progress: false

jobs:
  scheduled-session:
    name: One hashtag, maximum 20 new follows + likes
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Determine one local Toronto session and its hashtag
        id: session
        env:
          CRON_EXPRESSION: ${{ github.event.schedule }}
          MANUAL_SLOT: ${{ inputs.slot || '5am' }}
        run: python -m scripts.instagram_schedule
      - name: Install pinned Instagram client
        if: steps.session.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt
      - name: Offline verification
        if: steps.session.outputs.run == 'true'
        run: python -m unittest -v test_instagram_schedule test_instagram_cycle test_instagram_web_recent_probe test_instagram_web_recent
      - name: Follow and like at most 20 NEW authors/posts from one hashtag
        if: steps.session.outputs.run == 'true'
        env:
          IG_HASHTAG: ${{ steps.session.outputs.hashtag }}
          IG_SESSION_JSON: ${{ secrets.IG_SESSION_JSON }}
          IG_SESSION_GZIP_B64: ${{ secrets.IG_SESSION_GZIP_B64 }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/ig-report"
          python -m scripts.manual_instagram_actions \
            --hashtag "$IG_HASHTAG" \
            --target-count 20 \
            --single-hashtag \
            --max-pages 3 \
            --output-dir "$RUNNER_TEMP/ig-report"
      - name: Publish outcome even if Instagram blocks an action
        if: always() && steps.session.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: instagram-session-${{ steps.session.outputs.slot }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ig-report/
          if-no-files-found: warn
          retention-days: 14
