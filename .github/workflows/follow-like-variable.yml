name: Instagram - rotate 5 hashtags every 20 likes

# Daily test: 9:00 AM America/Toronto (DST-aware).
# IG_LIKE_COUNT controls total new likes/follows (default 2).
# Each group of 20 confirmed likes switches to the next hashtag.
# Set repository variable IG_ENABLE_DAILY=false to pause daily runs while retaining manual runs.
on:
  schedule:
    - cron: '0 13 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preview or actually follow authors and like posts'
        required: true
        type: choice
        options:
          - preview
          - follow_like
        default: preview

permissions:
  contents: read

concurrency:
  group: instagram-manual-one-account
  cancel-in-progress: false

jobs:
  follow-and-like-test:
    name: Follow and like IG_LIKE_COUNT, switching hashtag each 20 confirmed likes
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Select daily 9 AM Toronto window (or manual dispatch)
        id: schedule_window
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRON_EXPRESSION: ${{ github.event.schedule }}
          IG_ENABLE_DAILY: ${{ vars.IG_ENABLE_DAILY || 'true' }}
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          import os
          now = datetime.now(ZoneInfo("America/Toronto"))
          hour_utc = 13 if now.dst() != timedelta(0) else 14
          correct_cron = os.environ.get("CRON_EXPRESSION") == f"0 {hour_utc} * * *"
          manual = os.environ["EVENT_NAME"] == "workflow_dispatch"
          daily_enabled = os.environ["IG_ENABLE_DAILY"].lower() != "false"
          selected = manual or (correct_cron and daily_enabled)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              print("run=" + str(selected).lower(), file=handle)
          print("Toronto date:", now.strftime("%Y-%m-%d %Z"))
          print("Event:", os.environ["EVENT_NAME"], "daily enabled:", daily_enabled, "run:", selected)
          PY
      - uses: actions/checkout@v4
        if: steps.schedule_window.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.schedule_window.outputs.run == 'true'
        with:
          python-version: '3.11'
      - name: Install dependencies
        if: steps.schedule_window.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt
      - name: Test variable-driven logic offline
        if: steps.schedule_window.outputs.run == 'true'
        run: python -m unittest -v test_like_posts_variable test_manual_instagram_actions
      - name: Preview or follow-and-like
        if: steps.schedule_window.outputs.run == 'true'
        id: instagram
        continue-on-error: true
        env:
          RUN_MODE: ${{ github.event_name == 'schedule' && 'follow_like' || inputs.mode }}
          IG_LIKE_COUNT: ${{ vars.IG_LIKE_COUNT || '2' }}
          IG_SESSION_JSON: ${{ secrets.IG_SESSION_JSON }}
          IG_SESSION_GZIP_B64: ${{ secrets.IG_SESSION_GZIP_B64 }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/instagram-follow-like-test"
          python -m scripts.like_posts_variable \
            --mode "$RUN_MODE" \
            --count "$IG_LIKE_COUNT" \
            --max-pages 3 \
            --output-dir "$RUNNER_TEMP/instagram-follow-like-test"
      - name: Upload result summary (without session data)
        if: always() && steps.schedule_window.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: instagram-follow-like-${{ github.run_id }}
          path: ${{ runner.temp }}/instagram-follow-like-test/
          if-no-files-found: warn
          retention-days: 14
      - name: Fail job if engagement was not completed
        if: steps.schedule_window.outputs.run == 'true' && steps.instagram.outcome == 'failure'
        run: |
          echo "Instagram run incomplete; review Summary and artifact." >&2
          exit 1
