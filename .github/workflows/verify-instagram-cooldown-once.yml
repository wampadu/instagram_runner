name: Verify Instagram 50-pair cooldown (offline)

on:
  push:
    paths:
      - '.github/workflows/verify-instagram-cooldown-once.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt
      - name: Regression tests (cooldowns mocked; no live Instagram actions)
        run: python -m unittest -v test_instagram_cycle test_instagram_web_recent_probe test_instagram_web_recent
      - name: Syntax check
        run: python -m py_compile scripts/manual_instagram_actions.py
