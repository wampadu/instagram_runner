name: One-time Instagram one NEW follow and like

# Temporary live run after the original selected an already-engaged post.
# Triggers once on the creation commit; no schedule.
on:
  push:
    paths:
      - '.github/workflows/one-time-ig-new-person.yml'

permissions:
  contents: read

concurrency:
  group: instagram-manual-one-account
  cancel-in-progress: false

jobs:
  new-follow-and-like:
    if: github.event.head_commit.message == 'Trigger one NEW Instagram follow and like'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt
      - name: Offline checks
        run: python -m unittest -v test_like_posts_variable test_manual_instagram_actions
      - name: LIVE - verify a new author and follow and like one post
        env:
          IG_SESSION_JSON: ${{ secrets.IG_SESSION_JSON }}
          IG_SESSION_GZIP_B64: ${{ secrets.IG_SESSION_GZIP_B64 }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/ig-one-new"
          python -m scripts.like_posts_variable \
            --mode follow_like \
            --count 1 \
            --max-pages 3 \
            --output-dir "$RUNNER_TEMP/ig-one-new"
      - name: Upload confirmed result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-one-new-${{ github.run_id }}
          path: ${{ runner.temp }}/ig-one-new/
          if-no-files-found: warn
          retention-days: 7
