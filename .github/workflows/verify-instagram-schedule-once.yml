name: Verify Instagram scheduled workflow wiring (offline)
on:
  push:
    paths:
      - '.github/workflows/verify-instagram-schedule-once.yml'
permissions:
  contents: read
  actions: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check registered scheduled workflow is active and Actions API readable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          url = "https://api.github.com/repos/wampadu/instagram_runner/actions/workflows/manual-instagram.yml"
          req = Request(url, headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "User-Agent": "instagram-workflow-validation"
          })
          with urlopen(req, timeout=20) as f:
              data = json.load(f)
          print("Scheduled workflow state:", data.get("state"))
          print("Scheduled workflow path:", data.get("path"))
          assert data.get("state") == "active", "Workflow is not active in GitHub"
          from scripts.instagram_run_guard import fetch_runs
          runs = fetch_runs("wampadu/instagram_runner", os.environ["GH_TOKEN"])
          print("Recorded scheduled events:", len(runs))
          PY
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt
      - name: Offline schedule, deduplication and follow/like tests
        run: python -m unittest -v test_instagram_schedule test_instagram_run_guard test_instagram_cycle test_instagram_web_recent_probe test_instagram_web_recent
      - name: Syntax check
        run: python -m py_compile scripts/instagram_schedule.py scripts/instagram_run_guard.py scripts/manual_instagram_actions.py
