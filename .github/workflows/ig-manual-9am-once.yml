name: One-time 9am Instagram session (manually initiated)
run-name: "Manual request: 9am #likeforlike (max 20)"
on:
  push:
    paths:
      - '.github/workflows/ig-manual-9am-once.yml'
permissions:
  contents: read
concurrency:
  group: instagram-one-account
  cancel-in-progress: false
jobs:
  nine-am:
    name: 9AM - Likeforlike, up to 20 confirmed new pairs
    runs-on: ubuntu-latest
    timeout-minutes: 70
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Instagram dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt
      - name: Check latest script against offline regressions
        run: python -m unittest -v test_instagram_schedule test_instagram_run_guard test_instagram_cycle test_instagram_web_recent_probe test_instagram_web_recent
      - name: Run one 9AM Instagram hashtag session
        env:
          IG_SESSION_JSON: ${{ secrets.IG_SESSION_JSON }}
          IG_SESSION_GZIP_B64: ${{ secrets.IG_SESSION_GZIP_B64 }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/ig-report"
          python -m scripts.manual_instagram_actions \
            --hashtag likeforlike \
            --single-hashtag \
            --target-count 20 \
            --max-pages 3 \
            --output-dir "$RUNNER_TEMP/ig-report"
      - name: Preserve exact follow and like results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-9am-instagram-${{ github.run_id }}
          path: ${{ runner.temp }}/ig-report/
          if-no-files-found: warn
          retention-days: 14
