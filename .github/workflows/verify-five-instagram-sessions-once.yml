name: Verify five Toronto Instagram sessions (offline)
on:
  push:
    paths:
      - '.github/workflows/verify-five-instagram-sessions-once.yml'
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt
      - name: Test DST-aware session schedules, single-hashtag caps and Instagram logic
        run: python -m unittest -v test_instagram_schedule test_instagram_cycle test_instagram_web_recent_probe test_instagram_web_recent
      - name: Validate Python syntax
        run: python -m py_compile scripts/instagram_schedule.py scripts/manual_instagram_actions.py
