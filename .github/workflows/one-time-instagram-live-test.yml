name: Instagram one-time live test (2 follow + like)

# Temporary workflow triggered by its creation commit only; not scheduled.
on:
  push:
    paths:
      - '.github/workflows/one-time-instagram-live-test.yml'

permissions:
  contents: read

concurrency:
  group: instagram-manual-one-account
  cancel-in-progress: false

jobs:
  live-two-post-test:
    if: github.event.head_commit.message == 'Trigger one-time two-post Instagram live test'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt
      - name: Offline tests before live request
        run: python -m unittest -v test_like_posts_variable test_manual_instagram_actions
      - name: LIVE - follow two creators and like two posts
        env:
          IG_SESSION_JSON: ${{ secrets.IG_SESSION_JSON }}
          IG_SESSION_GZIP_B64: ${{ secrets.IG_SESSION_GZIP_B64 }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/ig-live-two"
          python -m scripts.like_posts_variable \
            --mode follow_like \
            --count 2 \
            --max-pages 3 \
            --output-dir "$RUNNER_TEMP/ig-live-two"
      - name: Publish results (no session data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-live-two-${{ github.run_id }}
          path: ${{ runner.temp }}/ig-live-two/
          if-no-files-found: warn
          retention-days: 7
