name: Windows interactive login installation smoke test

on:
  push:
    paths:
      - '.github/workflows/windows-login-setup-test.yml'
      - 'login_windows.cmd'
      - 'scripts/aiograpi_interactive_login.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install same pinned source ZIP as Windows launcher
        shell: pwsh
        run: python -m pip install --disable-pip-version-check 'https://codeload.github.com/subzeroid/aiograpi/zip/872039d37a61e5d60e07d47d3a230eafc23085e8'
      - name: Check client and interactive login imports without credentials
        shell: pwsh
        run: python -c "from aiograpi import Client; from scripts.aiograpi_interactive_login import authenticate; print('Windows install and imports passed')"
