name: One-time tests for original Instagram skip-and-continue

on:
  push:
    paths:
      - '.github/workflows/test-original-skip-once.yml'

permissions:
  contents: read

jobs:
  validate-original:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt
      - name: Run all original Instagram offline tests
        run: python -m unittest -v test_manual_instagram_actions
