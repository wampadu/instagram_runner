name: Verify Instagram skip empty hashtag rotation (offline)
# Regression retest after correcting expected repeat pass.
on:
  push:
    paths:
      - '.github/workflows/verify-empty-hashtag-rotation-once.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt
      - name: Run Instagram rotation regression tests (no real follows or likes)
        run: python -m unittest -v test_instagram_cycle test_instagram_web_recent_probe test_instagram_web_recent
      - name: Validate script syntax
        run: python -m py_compile scripts/manual_instagram_actions.py
