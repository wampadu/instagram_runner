name: aiograpi compatibility check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aiograpi-check.yml'
  workflow_dispatch:
    inputs:
      test_login:
        description: "Attempt one Instagram login after dependency smoke test"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: instagram-aiograpi-compatibility
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install aiograpi
        run: python -m pip install --disable-pip-version-check 'git+https://github.com/subzeroid/aiograpi.git@872039d37a61e5d60e07d47d3a230eafc23085e8'
      - name: Import and interface smoke test
        run: |
          python - <<'PY'
          import importlib.metadata
          import inspect
          from aiograpi import Client
          if not inspect.iscoroutinefunction(Client.login):
              raise RuntimeError("Unexpected API: Client.login must be async")
          if not inspect.iscoroutinefunction(Client.account_info):
              raise RuntimeError("Unexpected API: Client.account_info must be async")
          print("aiograpi version:", importlib.metadata.version("aiograpi"))
          print("Client import: passed; async login/account_info methods verified")
          for name in ("login", "account_info", "hashtag_medias_recent", "hashtag_medias_top", "media_like", "user_follow"):
              print(f"{name}: {'available' if callable(getattr(Client, name, None)) else 'unavailable'}")
          print("Login parameters:", ", ".join(inspect.signature(Client.login).parameters))
          PY
      - name: One real login and authenticated read (no proxy, no writes)
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.test_login) || (github.event_name == 'push' && github.event.head_commit.message == 'One-shot upstream password key fix validation') }}
        env:
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          IG_2FA_CODE: ${{ secrets.IG_2FA_CODE }}
        run: python scripts/aiograpi_login_check.py
