name: 'Instagram Automated — Loop and Engagement'

# Runs automatically at 9:00 AM UTC daily, plus manual trigger support.
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      hashtag:
        description: 'Override starting hashtag (optional)'
        required: false
        type: string
        default: 'follow_for_follow'

permissions:
  contents: read

concurrency:
  group: instagram-manual-one-account
  cancel-in-progress: false

jobs:
  automated-run:
    name: Cycle hashtags and engage target count
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Instagram client
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements.txt
      - name: Offline tests
        run: |
          python -m unittest -v test_instagram_web_recent_probe test_instagram_web_recent
      - name: Execute engagement cycle
        id: instagram
        continue-on-error: true
        env:
          # Pulls target count from your repository variable (default to 5 if not found)
          TARGET_COUNT: ${{ vars.IG_LIKE_FOLLOW || 5 }}
          IG_HASHTAG: ${{ inputs.hashtag || 'follow_for_follow' }}
          IG_SESSION_JSON: ${{ secrets.IG_SESSION_JSON }}
          IG_SESSION_GZIP_B64: ${{ secrets.IG_SESSION_GZIP_B64 }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/ig-report"
          python -m scripts.manual_instagram_actions \
            --mode "follow_like" \
            --hashtag "$IG_HASHTAG" \
            --target-count "$TARGET_COUNT" \
            --max-pages 3 \
            --output-dir "$RUNNER_TEMP/ig-report"
      - name: Publish result JSON and Markdown
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-automated-results-${{ github.run_id }}
          path: ${{ runner.temp }}/ig-report/
          if-no-files-found: warn
          retention-days: 14
      - name: Reflect Instagram result in job status
        if: steps.instagram.outcome == 'failure'
        run: |
          echo 'Instagram workflow processing failed.' >&2
          exit 1
